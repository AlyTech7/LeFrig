<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Soft plate shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <!-- Tip glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Pearl specular -->
    <radialGradient id="pearl" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#c9bba8"/>
    </radialGradient>
    <radialGradient id="coreShade" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1a1b22"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>
    <!-- Cardinal gradients (dual-facet depth) -->
    <linearGradient id="gnA" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6ee7a8"/>
      <stop offset="55%" stop-color="#2d9a64"/>
      <stop offset="100%" stop-color="#165a3a"/>
    </linearGradient>
    <linearGradient id="gnB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52d492"/>
      <stop offset="100%" stop-color="#1f7a52"/>
    </linearGradient>
    <linearGradient id="gdA" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#f0cc7a"/>
      <stop offset="55%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#8a6b2e"/>
    </linearGradient>
    <linearGradient id="gdB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#e8c56a"/>
    </linearGradient>
    <linearGradient id="orA" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#e88a5c"/>
      <stop offset="55%" stop-color="#c45c3a"/>
      <stop offset="100%" stop-color="#8f3d24"/>
    </linearGradient>
    <linearGradient id="orB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4613f"/>
      <stop offset="100%" stop-color="#a84828"/>
    </linearGradient>
    <linearGradient id="puA" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8b6fc4"/>
      <stop offset="55%" stop-color="#5c3f8f"/>
      <stop offset="100%" stop-color="#3d2860"/>
    </linearGradient>
    <linearGradient id="puB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b4fa0"/>
      <stop offset="100%" stop-color="#4a3278"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0cc7a"/>
      <stop offset="50%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#8a6b2e"/>
    </linearGradient>
    <linearGradient id="spikeHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a44"/>
      <stop offset="100%" stop-color="#222228"/>
    </linearGradient>
    <linearGradient id="spikeLo" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#404048"/>
      <stop offset="100%" stop-color="#2a2a32"/>
    </linearGradient>
  </defs>

  <!-- App plate -->
  <rect width="512" height="512" rx="96" fill="#08090c"/>

  <g transform="translate(256 256) scale(4.55) translate(-50 -50)" filter="url(#shadow)">
    <!-- Ambient rim light -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(201,162,77,0.08)" stroke-width="1.2"/>

    <!-- Orbit -->
    <circle cx="50" cy="50" r="44" stroke="rgba(244,241,234,0.18)" stroke-width="0.7" stroke-dasharray="1.8 3.6" fill="none"/>
    <circle cx="50" cy="50" r="44" stroke="rgba(201,162,77,0.12)" stroke-width="0.35" stroke-dasharray="1.8 3.6" stroke-dashoffset="2.7" fill="none"/>

    <!-- Diagonal spikes -->
    <path d="M58 42 L68 32 L52 48 Z" fill="url(#spikeHi)"/>
    <path d="M58 58 L68 68 L52 52 Z" fill="url(#spikeLo)"/>
    <path d="M42 58 L32 68 L48 52 Z" fill="url(#spikeHi)"/>
    <path d="M42 42 L32 32 L48 48 Z" fill="url(#spikeLo)"/>

    <!-- Cardinals with facet depth -->
    <g filter="url(#glow)">
      <path d="M50 11 L61 27 L50 35 L39 27 Z" fill="url(#gnA)"/>
      <path d="M50 11 L50 35 L39 27 Z" fill="url(#gnB)" opacity="0.9"/>
      <path d="M50 13.5 L56.5 26 L50 31.5 L43.5 26 Z" fill="rgba(255,255,255,0.12)"/>

      <path d="M89 50 L73 61 L65 50 L73 39 Z" fill="url(#gdA)"/>
      <path d="M89 50 L65 50 L73 39 Z" fill="url(#gdB)" opacity="0.9"/>
      <path d="M86 50 L73.5 56.5 L68.5 50 L73.5 43.5 Z" fill="rgba(255,255,255,0.14)"/>

      <path d="M50 89 L39 73 L50 65 L61 73 Z" fill="url(#orA)"/>
      <path d="M50 89 L50 65 L61 73 Z" fill="url(#orB)" opacity="0.9"/>
      <path d="M50 86 L43.5 73.5 L50 68.5 L56.5 73.5 Z" fill="rgba(255,255,255,0.1)"/>

      <path d="M11 50 L27 39 L35 50 L27 61 Z" fill="url(#puA)"/>
      <path d="M11 50 L35 50 L27 61 Z" fill="url(#puB)" opacity="0.9"/>
      <path d="M14 50 L26.5 43.5 L31.5 50 L26.5 56.5 Z" fill="rgba(255,255,255,0.12)"/>
    </g>

    <!-- Core -->
    <circle cx="50" cy="50" r="12.2" fill="url(#coreShade)"/>
    <circle cx="50" cy="50" r="12.2" stroke="url(#goldRing)" stroke-width="1.35" fill="none"/>
    <circle cx="50" cy="50" r="12.2" stroke="rgba(255,255,255,0.18)" stroke-width="0.35" fill="none"/>
    <!-- Inner hairline -->
    <circle cx="50" cy="50" r="8.4" stroke="rgba(201,162,77,0.28)" stroke-width="0.4" fill="none"/>
    <!-- Pearl eye -->
    <circle cx="50" cy="50" r="2.45" fill="url(#pearl)"/>
    <circle cx="49.2" cy="49" r="0.7" fill="rgba(255,255,255,0.85)"/>
  </g>
</svg>
