name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lefrig
          POSTGRES_PASSWORD: lefrig
          POSTGRES_DB: lefrig
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lefrig:lefrig@localhost:5432/lefrig
      JWT_SECRET: ci-test-secret-min-32-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars
      AUTH_LEGACY_JWT: 'true'
      ENABLE_SWAGGER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @lefrig/shared build
      - name: Generate Prisma client
        run: pnpm --filter @lefrig/api exec prisma generate
      - name: Migrate database
        run: pnpm --filter @lefrig/api exec prisma migrate deploy
      - name: Test API
        run: pnpm --filter @lefrig/api test
      - name: Build API
        run: pnpm --filter @lefrig/api build

  build-web:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web (monorepo — incluye typecheck)
        run: pnpm turbo run build --filter=@lefrig/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
