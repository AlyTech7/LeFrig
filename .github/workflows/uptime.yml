name: Production uptime

on:
  schedule:
    # Cada 5 min — alerta si la API cae o la DB se desconecta
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check API /health
        env:
          HEALTH_URL: https://whale-app-xpe4g.ondigitalocean.app/health
        run: |
          set -euo pipefail
          echo "Checking $HEALTH_URL"
          HTTP=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$HEALTH_URL")
          echo "HTTP $HTTP"
          echo "Body: $(cat /tmp/health.json)"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Expected HTTP 200, got $HTTP"
            exit 1
          fi
          jq -e '.status == "ok" and .db == "connected"' /tmp/health.json > /dev/null

      - name: Open incident issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 LeFrig API health check failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'El monitor de producción detectó un fallo en `/health`.',
              '',
              '- HTTP distinto de 200, o',
              '- `status !== ok`, o',
              '- `db: disconnected`',
              '',
              `Workflow: ${runUrl}`,
              '',
              'Revisar DigitalOcean App Platform y PostgreSQL.',
            ].join('\n');
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (openIssues.some((issue) => issue.title === title)) {
              core.info('Incident issue already open — skipping duplicate');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
