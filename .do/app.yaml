# DigitalOcean App Platform — solo API NestJS (Docker)
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# En DO: Settings → App Spec → pegar o conectar repo con este archivo.
# Secrets (DATABASE_URL, CLERK_*, JWT_*) se configuran en el panel, no aquí.

name: lefrig-api
region: fra

services:
  - name: lefrig-api
    github:
      repo: AlyTech7/LeFrig
      branch: master
      deploy_on_push: true
    # Monorepo: raíz del repo (Dockerfile copia packages + apps/api)
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        value: production
      - key: API_PUBLIC_URL
        value: https://whale-app-xpe4g.ondigitalocean.app
      - key: CORS_ORIGINS
        value: https://www.lefrig.com,https://lefrig.com,https://lefrig.vercel.app,https://admin.lefrig.com,https://lefrig-admin.vercel.app,http://localhost:8082,http://localhost:3000,http://127.0.0.1:8082
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://www.lefrig.com,https://lefrig.com,https://admin.lefrig.com,https://lefrig.vercel.app,https://lefrig-admin.vercel.app,http://localhost:8082,http://localhost:3000,http://127.0.0.1:8082
      - key: ENABLE_SWAGGER
        value: 'false'
      - key: AUTH_LEGACY_JWT
        value: 'false'
      - key: MEILI_SYNC_ON_BOOT
        value: 'false'
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_ENVIRONMENT
        value: production
        scope: RUN_TIME
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CLERK_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: JWT_REFRESH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_ENDPOINT
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_PUBLIC_URL
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_REGION
        value: fra1
        scope: RUN_TIME
      - key: STORAGE_FORCE_PATH_STYLE
        value: 'false'
        scope: RUN_TIME
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      - key: MEILISEARCH_HOST
        scope: RUN_TIME
        type: SECRET
      - key: MEILISEARCH_API_KEY
        scope: RUN_TIME
        type: SECRET
