# DigitalOcean App Platform — API staging (pre-producción)
# Crear app separada en DO; no compartir DATABASE_URL con producción.

name: lefrig-api-staging
region: fra

services:
  - name: lefrig-api-staging
    github:
      repo: AlyTech7/LeFrig
      branch: master
      deploy_on_push: true
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        value: production
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: API_PUBLIC_URL
        value: https://api-staging.lefrig.com
      - key: CORS_ORIGINS
        value: https://staging.lefrig.com,https://lefrig-staging.vercel.app,http://localhost:3000
      - key: ENABLE_SWAGGER
        value: 'true'
      - key: AUTH_LEGACY_JWT
        value: 'true'
      - key: OTP_MOCK_CODE
        value: '123456'
      - key: MEILI_SYNC_ON_BOOT
        value: 'false'
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: JWT_REFRESH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_ENDPOINT
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_PUBLIC_URL
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_REGION
        value: fra1
        scope: RUN_TIME
      - key: MEILISEARCH_HOST
        scope: RUN_TIME
        type: SECRET
      - key: MEILISEARCH_API_KEY
        scope: RUN_TIME
        type: SECRET
