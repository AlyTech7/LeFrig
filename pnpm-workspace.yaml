packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@clerk/shared': set this to true or false
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  '@scarf/scarf': set this to true or false
  '@sentry/cli': set this to true or false
  browser-tabs-lock: set this to true or false
  bufferutil: set this to true or false
  core-js: set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
  utf-8-validate: set this to true or false

nodeLinker: hoisted

# pnpm v10+: settings live here. Keep in sync with package.json pnpm.overrides (v9).
overrides:
  "@clerk/backend>react": "19.1.0"
  "@clerk/backend>react-dom": "19.1.0"
  next: "15.5.22"
  vitest: "^3.2.6"
  "@nestjs/core": "^11.1.18"
  "@clerk/clerk-expo": "^2.19.36"
  "@clerk/clerk-react": "^5.61.6"
  "ajv@8": ">=8.18.0"
  body-parser: ">=1.20.6"
  "brace-expansion@1": "1.1.17"
  "brace-expansion@2": "2.1.3"
  "brace-expansion@5": "5.0.8"
  esbuild: ">=0.25.0"
  fast-uri: ">=3.1.4"
  file-type: ">=21.3.2"
  glob: ">=10.5.0"
  "js-yaml@4": "4.3.0"
  "js-yaml@5": "5.2.2"
  lodash: ">=4.17.23"
  multer: ">=2.2.0"
  picomatch: ">=2.3.1"
  postcss: "8.5.25"
  qs: ">=6.15.2"
  sharp: ">=0.35.0"
  tar: ">=7.5.21"
  tmp: ">=0.2.4"
  uuid: "11.1.1"
  vite: ">=6.4.3"
  webpack: ">=5.104.1"
  "ws@8": "8.21.1"
